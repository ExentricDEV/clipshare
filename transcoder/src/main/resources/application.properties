spring.application.name=transcoder-worker
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# One job at a time per worker: transcodes are long and CPU-bound, so prefetching more would just
# park jobs behind a busy worker while another sits idle. Scale out by running more workers.
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1

# Retry a failed job 3 more times with exponential backoff (2s, 4s, 8s, capped at 10s), then reject it
# without requeueing so RabbitMQ dead-letters it to transcoder-failures instead of looping forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s

# Bitrate ladder and limits
app.transcode.min-timeout=120s
app.transcode.timeout-per-media-second=4
